services:
  nginx:
    image: nginx:alpine
    container_name: radar-video-nginx
    ports:
      - "8083:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./video-storage:/var/www/html/recordings
      - ./hls-output:/var/www/html/hls
    restart: unless-stopped
    networks:
      - radar-network

  ffmpeg:
    image: alpine:latest
    container_name: radar-video-ffmpeg
    volumes:
      - ./video-storage:/recordings
      - ./hls-output:/hls
    command: ["sh", "-c", "echo 'FFmpeg service ready for RTSP to HLS conversion' && echo 'Use the API endpoints to start/stop streams' && tail -f /dev/null"]
    restart: unless-stopped
    networks:
      - radar-network

networks:
  radar-network:
    driver: bridge

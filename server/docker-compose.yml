services:
  # Backend Server (uses host's Redis and MongoDB)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radar-ai-backend
    network_mode: host
    environment:
      - NODE_ENV=production
      - DOCKER=true
      - PORT=8080
      - HEALTH_PORT=9081
      - LOG_LEVEL=info
      - REDIS_HOST=192.168.6.22
      - REDIS_PORT=6379
      - MONGODB_HOST=192.168.6.22
      - MONGODB_PORT=27017
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=admin123
      - MONGODB_AUTH_DATABASE=admin
      - MONGODB_DASHBOARD_DATABASE=traffic_signal_dashboard
      - RADAR_PROTOCOL_VERSION=2.1
      - RADAR_DEVICE_ID=P1-center
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9081/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
